[package]
name = "cucuto-jxl"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Spike: JPEG XL decoding for the Cucuto Android app via jxl-rs behind a tiny JNI layer"
publish = false

[lib]
name = "cucuto_jxl"
crate-type = ["cdylib", "rlib"]

[dependencies]
# jxl-rs, the decoder Chrome and Firefox ship. BSD-3-Clause.
jxl = "0.8.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind" # JNI entry points catch panics and turn them into Java exceptions

# Size-optimised variant, measured for the ADR (`cargo ndk ... build --profile release-small`).
[profile.release-small]
inherits = "release"
opt-level = "s"
