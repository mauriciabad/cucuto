# Single source of truth for every Android dependency and plugin version.
# Latest stable releases as of 2026-10-23 (see docs/decisions/0001-android-build-and-versions.md).
# The only pre-release is Compose Material 3 1.5.0 (beta), allowed by the brief for Material 3 Expressive.

[versions]
# Build toolchain
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
jdk = "21"
# SDK levels (Android 17). compileSdk is 37.2, the newest 37.x platform.
sdk-compile = "37"
sdk-compile-minor = "2"
build-tools = "37.0.0"
sdk-min = "37"
sdk-target = "37"
# NDK r30, the newest stable: cargo-ndk links the Rust crate of :core:jxl against it (ADR 0006).
ndk = "30.0.16248370"

# AndroidX and Compose
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-lifecycle = "2.11.0"
androidx-navigation3 = "1.2.0"
androidx-hilt = "1.4.0"
androidx-room3 = "3.0.3"
androidx-sqlite = "2.7.1"
androidx-datastore = "1.3.0"
compose-bom = "2026.09.00"
compose-material3 = "1.5.0-beta02"
compose-material-icons = "1.7.8"

# Kotlin libraries
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"

# Third party
hilt = "2.60.1"
coil = "3.6.3"
okhttp = "5.5.1"
libxposed-api = "102.0.0"
libxposed-service = "102.0.0"
material-color-utilities = "6.0.0"

# Testing
junit4 = "4.13.2"
turbine = "1.2.1"
robolectric = "4.17"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-espresso = "3.7.0"

# Code style
spotless = "8.10.4"
ktlint = "1.8.0"
compose-rules = "0.6.8"

[libraries]
# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "androidx-room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "androidx-room3" }
androidx-room3-testing = { module = "androidx.room3:room3-testing", version.ref = "androidx-room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

# Compose (versions from the BOM, except Material 3 which is pinned to the Expressive beta)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "compose-material-icons" }

# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Third party
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# Sprites in packs may be SVG (pack format "Images"); AndroidSVG renders them with no scripting or network.
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed-api" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed-service" }
# Kotlin port of Google's Material Color Utilities: seed to scheme, quantizer and scoring (ADR 0014).
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "material-color-utilities" }

# Testing
junit4 = { module = "junit:junit", version.ref = "junit4" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
# Compose UI tests pull Espresso 3.5, which cannot find InputManager on Android 17 (Robolectric); 3.7 can.
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }

# Gradle plugins, used as dependencies of the build-logic convention plugins
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
room3-gradlePlugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "androidx-room3" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# Not resolved by Gradle: read by the spotless convention plugin to pin the ktlint engine and Compose rules.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
compose-rules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version.ref = "compose-rules" }

[plugins]
# Convention plugins (android/build-logic)
cucuto-android-application = { id = "cucuto.android.application" }
cucuto-android-library = { id = "cucuto.android.library" }
cucuto-android-compose = { id = "cucuto.android.compose" }
cucuto-android-hilt = { id = "cucuto.android.hilt" }
cucuto-android-room = { id = "cucuto.android.room" }
cucuto-kotlin-library = { id = "cucuto.kotlin.library" }
cucuto-kotlin-serialization = { id = "cucuto.kotlin.serialization" }
cucuto-spotless = { id = "cucuto.spotless" }
