# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Kotlin
kotlin.code.style=official

# Android: AGP 9 defaults (built-in Kotlin, new DSL, unique package names) are kept, with no opt-outs.

# Screenshot tests (ADR 0032): golden image names are relative to Roborazzi's outputDir (app/src/testDebug/screenshots).
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
