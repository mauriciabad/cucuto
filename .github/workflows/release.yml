name: release

# Builds the signed release APK when a version tag is pushed, attaches it and its SHA-256 checksum to a GitHub
# Release, then rebuilds the website so its Download APK button points at the new version (web/scripts/build-data.ts
# reads the latest v* release with an .apk asset).
#
# Release: merge to main, then `git tag v1.2.3 && git push origin v1.2.3`. The tag sets the version:
# versionName 1.2.3, versionCode 1002003 (MAJOR * 1_000_000 + MINOR * 1_000 + PATCH). Guide: docs/releasing.md.
# Decision: docs/decisions/0021-signed-release-apk.md.
#
# Release notes come from the Conventional Commits since the previous tag (tools/release/release-notes.main.kts,
# ADR 0046). The `reproducible` job then rebuilds the APK unsigned on a fresh runner, in another directory, and
# compares it with the published one (docs/reproducible-builds.md).
#
# Signing key: repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and
# RELEASE_KEY_PASSWORD, created by the owner with tools/release/setup-signing.main.kts. Without them the run fails
# before building. The secrets reach only the steps that need them, as environment variables (GitHub's guidance:
# never on a command line). The repository variable RELEASE_CERT_SHA256, when set, pins the signing certificate so a
# replaced key fails the release instead of shipping an APK that cannot update existing installs.
#
# Google Play (ADR 0071, owner update #287): the same build also makes the app bundle, signed with the same release
# key, and attaches cucuto-<version>.aab and its checksum. For Play that key is the upload key, and Play App Signing
# re-signs what it serves with the same release key, which the owner gave Play with PEPK. Nothing here uploads to
# Play: the owner does (docs/releasing.md).
#
# Actions are pinned to full commit SHAs (this workflow handles the signing key); Dependabot keeps the pins and their
# version comments current. To retry a failed run (for example after adding the secrets), re-run it from the
# Actions tab: a re-run reads the secrets again and an existing release only gets its assets replaced.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its assets
      actions: write # dispatch ci.yml for the website
    defaults:
      run:
        # -eo pipefail: a failing command in a pipe fails the step.
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag and the signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error title=Bad release tag::Tags must look like v1.2.3 (each part 0-999, no leading zeros), got '$TAG'."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))" >> "$GITHUB_ENV"

          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error title=Signing secrets missing::Missing repository secrets: ${missing[*]}. The owner creates the release key and sets them with 'kotlin tools/release/setup-signing.main.kts' (docs/releasing.md), then re-runs this workflow."
            {
              echo "## Release not built: signing secrets missing"
              echo
              echo "Missing: \`${missing[*]}\`."
              echo
              echo "The owner creates the release key and stores it as repository secrets with"
              echo "\`kotlin tools/release/setup-signing.main.kts\` (see \`docs/releasing.md\`), then re-runs this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents, to check that the tag is on main.
          fetch-depth: 0
          filter: blob:none

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"; then
            echo "::error title=Tag not on main::$TAG points at ${GITHUB_SHA::7}, which is not on ${{ github.event.repository.default_branch }}. Release only merged code: delete the tag, merge, tag again."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Read-only cache: nothing built with the signing key is ever written back.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # :core:jxl's native library (Rust, ADR 0006), set up as in ci.yml's android-assemble job.
      - name: Set up Rust toolchain (rust-toolchain.toml)
        working-directory: android/core/jxl/rust
        run: rustup toolchain install

      - name: Set up cargo-ndk
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-ndk@4.1.2

      - name: Install NDK r30
        # `yes` dies of SIGPIPE when sdkmanager exits; under pipefail that would fail the step.
        run: |
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: android/core/jxl/rust -> target
          save-if: false

      # Tests, lint and ktlint already ran in ci.yml on the way to main; this builds the release variant only
      # (R8, resource shrinking, lintVital): the APK and Google Play's app bundle (ADR 0071), from the same R8 output
      # and version, both signed with the release key (ci.yml builds both in one run too). The keystore lives in
      # RUNNER_TEMP for this step only. No configuration cache, so the passwords are never serialized into a cache
      # entry.
      - name: Build the signed release APK and Play bundle
        working-directory: android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          CUCUTO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CUCUTO_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CUCUTO_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export CUCUTO_RELEASE_KEYSTORE="$RUNNER_TEMP/cucuto-release.jks"
          trap 'rm -f "$CUCUTO_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$CUCUTO_RELEASE_KEYSTORE"
          ./gradlew :app:assembleRelease :app:bundleRelease -Pcucuto.version="$VERSION" --no-configuration-cache --stacktrace
          ./gradlew --stop

      - name: Verify the signature and the version
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=No signed APK::$apk is missing; the release build was not signed."
            ls -l android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)

          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          grep -v "^WARNING" "$RUNNER_TEMP/certs.txt" || true
          if [ "$(grep -c 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt")" != 1 ]; then
            echo "::error title=Unexpected signers::The APK must have exactly one signer."
            exit 1
          fi
          if grep -q 'certificate DN: .*CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error title=Debug-signed APK::The release APK is signed with a debug key."
            exit 1
          fi
          cert=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "::warning title=Certificate not pinned::Set the repository variable RELEASE_CERT_SHA256 to $cert so a replaced key fails the release (docs/releasing.md)."
          elif [ "$cert" != "$expected" ]; then
            echo "::error title=Signing key changed::The APK is signed by $cert, but RELEASE_CERT_SHA256 is $expected. Existing installs cannot update to an APK signed by another key (docs/releasing.md, 'If the signing key changes')."
            exit 1
          fi

          badging=$("$build_tools/aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          if [[ "$badging" != *"name='app.mauri.cucuto' versionCode='$VERSION_CODE' versionName='$VERSION'"* ]]; then
            echo "::error title=Wrong version::Expected app.mauri.cucuto $VERSION ($VERSION_CODE)."
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/cucuto-$VERSION.apk"
          (cd dist && sha256sum "cucuto-$VERSION.apk" | tee "cucuto-$VERSION.apk.sha256")
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

      # Google Play's app bundle (ADR 0071, owner updates #287). The release key is Play's upload key and, given to
      # Play with PEPK, its app signing key too, so Play installs and these APKs share one certificate. bundletool
      # reads the bundle's manifest and settings; pinned by version and checksum like the actions above.
      - name: Verify the Play bundle
        env:
          BUNDLETOOL_VERSION: "1.18.3"
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$aab" ]; then
            echo "::error title=No Play bundle::$aab is missing."
            exit 1
          fi
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$bundletool" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $bundletool" | sha256sum -c -

          # Signed (a bundle carries a JAR signature), by exactly one key: the release key that signed the APK, so the
          # upload key Play registered on the first upload never changes. Output captured first: under pipefail,
          # grep -q closing the pipe early would fail the pipeline.
          verified=$(jarsigner -verify "$aab")
          if [[ "$verified" != *"jar verified."* ]]; then
            echo "::error title=Unsigned bundle::$aab has no valid signature."
            exit 1
          fi
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/upload-certs.txt"
          if [ "$(grep -c '^Signer #' "$RUNNER_TEMP/upload-certs.txt")" != 1 ]; then
            echo "::error title=Unexpected signers::The bundle must have exactly one signer."
            exit 1
          fi
          if grep -q '^Owner: .*CN=Android Debug' "$RUNNER_TEMP/upload-certs.txt"; then
            echo "::error title=Debug-signed bundle::The bundle is signed with a debug key."
            exit 1
          fi
          upload=$(grep -m1 'SHA256:' "$RUNNER_TEMP/upload-certs.txt" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$upload" != "$CERT_SHA256" ]; then
            echo "::error title=Bundle signed by another key::The bundle is signed by $upload, but the APK by $CERT_SHA256. Both must use the release key, which is also Play's upload key (ADR 0071)."
            exit 1
          fi

          # The same version as the APK, 16 KB-aligned native libraries for Play's split APKs, and the module.
          manifest() { java -jar "$bundletool" dump manifest --bundle="$aab" --xpath="/manifest/@$1"; }
          package=$(manifest package)
          code=$(manifest android:versionCode)
          name=$(manifest android:versionName)
          if [ "$package $code $name" != "app.mauri.cucuto $VERSION_CODE $VERSION" ]; then
            echo "::error title=Wrong bundle version::Expected app.mauri.cucuto $VERSION_CODE $VERSION, got $package $code $name."
            exit 1
          fi
          config=$(java -jar "$bundletool" dump config --bundle="$aab")
          if [[ "$config" != *PAGE_ALIGNMENT_16K* ]]; then
            echo "::error title=16 KB alignment::The bundle doesn't ask for 16 KB-aligned native libraries (PAGE_ALIGNMENT_16K)."
            exit 1
          fi
          if ! unzip -l "$aab" base/root/META-INF/xposed/java_init.list > /dev/null; then
            echo "::error title=Module metadata missing::The bundle has no META-INF/xposed files; LSPosed wouldn't load a Play install."
            exit 1
          fi

          cp "$aab" "dist/cucuto-$VERSION.aab"
          (cd dist && sha256sum "cucuto-$VERSION.aab" | tee "cucuto-$VERSION.aab.sha256")

      # Release notes from the Conventional Commits since the previous tag, grouped for users (ADR 0046). The same
      # run writes the store changelog for this versionCode (fastlane/metadata/android/en-US/changelogs/) and the
      # CHANGELOG.md section. Normally the release PR already committed both (docs/releasing.md) and they are kept as
      # they are; if the tag lacks them, the generated files are shown in the summary to commit to main, since F-Droid
      # and IzzyOnDroid read the changelog from the tagged source.
      - name: Write the release notes
        run: |
          # Never let the notes stop a signed, verified APK from shipping: on failure, fall back to GitHub's list.
          if ! kotlin tools/release/release-notes.main.kts "$VERSION" --to "$TAG" --notes dist/changes.md; then
            echo "::warning title=Release notes not generated::tools/release/release-notes.main.kts failed; the release uses GitHub's generated notes instead."
            : > dist/changes.md
            echo "GENERATE_NOTES=true" >> "$GITHUB_ENV"
          fi
          changelog="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [ -n "$(git status --porcelain -- "$changelog" CHANGELOG.md)" ]; then
            git add -N -- "$changelog"
            echo "::warning title=Store changelog not in the tag::$TAG has no $changelog or CHANGELOG.md section. This run wrote them; commit them to main from the job summary (docs/releasing.md)."
            {
              echo "## Store changelog and CHANGELOG.md for $VERSION"
              echo
              echo "The tag didn't have them. Commit this patch to \`main\` (\`git apply\`), editing the words if needed:"
              echo
              echo '```diff'
              git diff -- "$changelog" CHANGELOG.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="dist/cucuto-$VERSION.apk"
          sha=$(cut -d' ' -f1 "$apk.sha256")
          {
            echo '> [!NOTE]'
            echo '> 🤖 Written by an AI agent (Claude), not by the repository owner.'
            echo
            echo "Cucuto $VERSION, built from \`$TAG\` (${GITHUB_SHA::7}) and signed by the release workflow."
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            echo "| \`$(basename "$apk")\` | $(numfmt --to=si --suffix=B "$(stat -c %s "$apk")") |"
            echo "| \`$(basename "$apk").sha256\` | SHA-256 checksum |"
            echo "| \`cucuto-$VERSION.aab\` | Google Play bundle; not for installing |"
            echo "| \`cucuto-$VERSION.aab.sha256\` | SHA-256 checksum |"
            echo
            echo 'Needs Android 17, root and LSPosed. Install guide: <https://cucuto.mauri.app/install/>.'
            echo 'After installing or updating, reboot: the module inside the system loads the new version at boot.'
            echo
            echo '**Verify the download**'
            echo
            echo "- SHA-256: \`$sha\` (\`sha256sum -c $(basename "$apk").sha256\`)"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\` (\`apksigner verify --print-certs $(basename "$apk")\`)."
            echo '  Every Cucuto release is signed by this certificate.'
            echo
            cat dist/changes.md
          } > dist/notes.md
          assets=("$apk" "$apk.sha256" "dist/cucuto-$VERSION.aab" "dist/cucuto-$VERSION.aab.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            extra=()
            if [ "${GENERATE_NOTES:-}" = true ]; then extra+=(--generate-notes); fi
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "Cucuto $VERSION" \
              --notes-file dist/notes.md "${extra[@]}"
          fi
          {
            echo "## Released Cucuto $VERSION"
            echo
            echo "- APK: \`$(basename "$apk")\`, versionCode $VERSION_CODE"
            echo "- SHA-256: \`$sha\`"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\`"
            echo "- Play bundle: \`cucuto-$VERSION.aab\`, signed with the same key (Play's upload key). Upload it to Play Console (docs/releasing.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Releases created with GITHUB_TOKEN don't trigger other workflows (site-rebuild.yml), so start the website
      # rebuild explicitly, as packs-release.yml does.
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.event.repository.default_branch }}" -f site_only=true

  # Reproducible build check (docs/reproducible-builds.md): rebuilds the tag without the signing key on a fresh runner,
  # from another directory and with another CARGO_HOME (as F-Droid or anyone verifying would), without any Gradle or
  # cargo cache, and compares every file inside the APK with the published one. The APK Signing Block is the only
  # part allowed to differ (minSdk 37 has no v1 signature files in META-INF). Runs after publishing, so a difference
  # never blocks a release; it fails this job and lists what differs in the summary.
  reproducible:
    name: Rebuild unsigned and compare
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      SRC: rebuild/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rebuild/src
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (no cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Set up Rust toolchain (rust-toolchain.toml)
        working-directory: rebuild/src/android/core/jxl/rust
        run: rustup toolchain install

      - name: Set up cargo-ndk
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-ndk@4.1.2

      - name: Install NDK r30
        run: |
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null

      - name: Build the unsigned release APK
        working-directory: rebuild/src/android
        env:
          # Another CARGO_HOME than the release job's ~/.cargo: dependency sources land in another directory.
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          ./gradlew :app:assembleRelease -Pcucuto.version="${TAG#v}" --no-build-cache --no-configuration-cache --stacktrace

      - name: Compare with the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "cucuto-$version.apk" --dir "$RUNNER_TEMP/published"
          published="$RUNNER_TEMP/published/cucuto-$version.apk"
          rebuilt="$SRC/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          unzip -q "$published" -d "$RUNNER_TEMP/a"
          unzip -q "$rebuilt" -d "$RUNNER_TEMP/b"
          entries() { (cd "$1" && find . -type f -print0 | sort -z | xargs -0 sha256sum); }
          if diff <(entries "$RUNNER_TEMP/a") <(entries "$RUNNER_TEMP/b") > "$RUNNER_TEMP/diff.txt"; then
            echo "Every file inside cucuto-$version.apk matches the rebuild."
            {
              echo "## Reproducible: yes"
              echo
              echo "Every file inside \`cucuto-$version.apk\` matches an unsigned rebuild of \`$TAG\` from another directory and CARGO_HOME, without caches."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Not reproducible::Files inside cucuto-$version.apk differ from an unsigned rebuild of $TAG (docs/reproducible-builds.md)."
            cat "$RUNNER_TEMP/diff.txt"
            {
              echo "## Reproducible: no"
              echo
              echo "Files inside \`cucuto-$version.apk\` that differ from an unsigned rebuild of \`$TAG\` (\`<\` published, \`>\` rebuilt):"
              echo
              echo '```diff'
              cat "$RUNNER_TEMP/diff.txt"
              echo '```'
              echo
              echo "See docs/reproducible-builds.md for the usual causes."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
