name: release

# Builds the signed release APK when a version tag is pushed, attaches it and its SHA-256 checksum to a GitHub
# Release, then rebuilds the website so its Download APK button points at the new version (web/scripts/build-data.ts
# reads the latest v* release with an .apk asset).
#
# Release: merge to main, then `git tag v1.2.3 && git push origin v1.2.3`. The tag sets the version:
# versionName 1.2.3, versionCode 1002003 (MAJOR * 1_000_000 + MINOR * 1_000 + PATCH). Guide: docs/releasing.md.
# Decision: docs/decisions/0021-signed-release-apk.md.
#
# Signing key: repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and
# RELEASE_KEY_PASSWORD, created by the owner with tools/release/setup-signing.main.kts. Without them the run fails
# before building. The secrets reach only the steps that need them, as environment variables (GitHub's guidance:
# never on a command line). The repository variable RELEASE_CERT_SHA256, when set, pins the signing certificate so a
# replaced key fails the release instead of shipping an APK that cannot update existing installs.
#
# Actions are pinned to full commit SHAs (this workflow handles the signing key); Dependabot keeps the pins and their
# version comments current. To retry a failed run (for example after adding the secrets), re-run it from the
# Actions tab: a re-run reads the secrets again and an existing release only gets its assets replaced.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its assets
      actions: write # dispatch ci.yml for the website
    defaults:
      run:
        # -eo pipefail: a failing command in a pipe fails the step.
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag and the signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error title=Bad release tag::Tags must look like v1.2.3 (each part 0-999, no leading zeros), got '$TAG'."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))" >> "$GITHUB_ENV"

          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error title=Signing secrets missing::Missing repository secrets: ${missing[*]}. The owner creates the release key and sets them with 'kotlin tools/release/setup-signing.main.kts' (docs/releasing.md), then re-runs this workflow."
            {
              echo "## Release not built: signing secrets missing"
              echo
              echo "Missing: \`${missing[*]}\`."
              echo
              echo "The owner creates the release key and stores it as repository secrets with"
              echo "\`kotlin tools/release/setup-signing.main.kts\` (see \`docs/releasing.md\`), then re-runs this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history without file contents, to check that the tag is on main.
          fetch-depth: 0
          filter: blob:none

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"; then
            echo "::error title=Tag not on main::$TAG points at ${GITHUB_SHA::7}, which is not on ${{ github.event.repository.default_branch }}. Release only merged code: delete the tag, merge, tag again."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Read-only cache: nothing built with the signing key is ever written back.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # :core:jxl's native library (Rust, ADR 0006), set up as in ci.yml's android-assemble job.
      - name: Set up Rust toolchain (rust-toolchain.toml)
        working-directory: android/core/jxl/rust
        run: rustup toolchain install

      - name: Set up cargo-ndk
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-ndk@4.1.2

      - name: Install NDK r30
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: android/core/jxl/rust -> target
          save-if: false

      # Tests, lint and ktlint already ran in ci.yml on the way to main; this builds the release variant only
      # (R8, resource shrinking, lintVital). The keystore lives in RUNNER_TEMP for this step only. No configuration
      # cache, so the passwords are never serialized into a cache entry.
      - name: Build the signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          CUCUTO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CUCUTO_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CUCUTO_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export CUCUTO_RELEASE_KEYSTORE="$RUNNER_TEMP/cucuto-release.jks"
          trap 'rm -f "$CUCUTO_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$CUCUTO_RELEASE_KEYSTORE"
          ./gradlew :app:assembleRelease -Pcucuto.version="$VERSION" --no-configuration-cache --stacktrace
          ./gradlew --stop

      - name: Verify the signature and the version
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=No signed APK::$apk is missing; the release build was not signed."
            ls -l android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)

          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          grep -v "^WARNING" "$RUNNER_TEMP/certs.txt" || true
          if [ "$(grep -c 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt")" != 1 ]; then
            echo "::error title=Unexpected signers::The APK must have exactly one signer."
            exit 1
          fi
          if grep -q 'certificate DN: .*CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error title=Debug-signed APK::The release APK is signed with a debug key."
            exit 1
          fi
          cert=$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "::warning title=Certificate not pinned::Set the repository variable RELEASE_CERT_SHA256 to $cert so a replaced key fails the release (docs/releasing.md)."
          elif [ "$cert" != "$expected" ]; then
            echo "::error title=Signing key changed::The APK is signed by $cert, but RELEASE_CERT_SHA256 is $expected. Existing installs cannot update to an APK signed by another key (docs/releasing.md, 'If the signing key changes')."
            exit 1
          fi

          badging=$("$build_tools/aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          if [[ "$badging" != *"name='app.mauri.cucuto' versionCode='$VERSION_CODE' versionName='$VERSION'"* ]]; then
            echo "::error title=Wrong version::Expected app.mauri.cucuto $VERSION ($VERSION_CODE)."
            exit 1
          fi

          mkdir -p dist
          cp "$apk" "dist/cucuto-$VERSION.apk"
          (cd dist && sha256sum "cucuto-$VERSION.apk" | tee "cucuto-$VERSION.apk.sha256")
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="dist/cucuto-$VERSION.apk"
          sha=$(cut -d' ' -f1 "$apk.sha256")
          {
            echo '> [!NOTE]'
            echo '> 🤖 Written by an AI agent (Claude), not by the repository owner.'
            echo
            echo "Cucuto $VERSION, built from \`$TAG\` (${GITHUB_SHA::7}) and signed by the release workflow."
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            echo "| \`$(basename "$apk")\` | $(numfmt --to=si --suffix=B "$(stat -c %s "$apk")") |"
            echo "| \`$(basename "$apk").sha256\` | SHA-256 checksum |"
            echo
            echo 'Needs Android 17, root and LSPosed. Install guide: <https://cucuto.mauri.app/install/>.'
            echo 'After installing or updating, reboot: the module inside the system loads the new version at boot.'
            echo
            echo '**Verify the download**'
            echo
            echo "- SHA-256: \`$sha\` (\`sha256sum -c $(basename "$apk").sha256\`)"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\` (\`apksigner verify --print-certs $(basename "$apk")\`)."
            echo '  Every Cucuto release is signed by this certificate.'
          } > dist/notes.md
          assets=("$apk" "$apk.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "Cucuto $VERSION" \
              --notes-file dist/notes.md --generate-notes
          fi
          {
            echo "## Released Cucuto $VERSION"
            echo
            echo "- APK: \`$(basename "$apk")\`, versionCode $VERSION_CODE"
            echo "- SHA-256: \`$sha\`"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Releases created with GITHUB_TOKEN don't trigger other workflows (site-rebuild.yml), so start the website
      # rebuild explicitly, as packs-release.yml does.
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.event.repository.default_branch }}" -f site_only=true
