name: explainer-video

# Builds the explainer video (issue #271, ADR 0070, docs/explainer-video.md) and uploads it as an artifact: the
# illustrated scenes in android/video rendered frame by frame on the JVM (Robolectric, no device), the English
# voice-over spoken by a local open-source text-to-speech model (Kokoro-82M on sherpa-onnx, no cloud service), then
# mixed and encoded with ffmpeg (CC0 demo-pack and brand sounds only). Manual only: run it from the Actions tab.
# The workflow commits nothing: an approved cut is published by hand (docs/explainer-video.md, Publishing; #302).

on:
  workflow_dispatch:
    inputs:
      av1_preset:
        description: "SVT-AV1 preset for the WebM (the brief's final setting is 4; higher is faster)"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: explainer-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    name: Explainer video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check inputs
        env:
          PRESET: ${{ inputs.av1_preset }}
        run: '[[ "$PRESET" =~ ^[0-9]{1,2}$ ]] || { echo "::error::av1_preset must be a number, got ''$PRESET''"; exit 1; }'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true

      # ffmpeg with SVT-AV1, x264 and Opus; the runner already has the Kotlin CLI for *.main.kts scripts.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      # The text-to-speech engine and model (about 370 MB), pinned by version and SHA-256 in voice.main.kts.
      - name: Cache the voice model
        uses: actions/cache@v6
        with:
          path: ~/.cache/cucuto/tts
          key: tts-${{ runner.os }}-${{ hashFiles('tools/video/voice.main.kts') }}

      - name: Render the frames
        working-directory: android
        run: ./gradlew :video:renderExplainerFrames --stacktrace

      - name: Speak the voice-over
        run: kotlin tools/video/voice.main.kts

      - name: Mix and encode
        env:
          PRESET: ${{ inputs.av1_preset }}
        run: kotlin tools/video/explainer.main.kts --av1-preset "$PRESET"

      - name: Upload the video
        uses: actions/upload-artifact@v7
        with:
          name: explainer-video
          path: |
            android/video/build/explainer/*.webm
            android/video/build/explainer/*.mp4
            android/video/build/explainer/explainer-poster.png
            android/video/build/explainer/voice/voice.tsv
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: explainer-video-reports
          path: |
            android/video/build/reports/tests/
            android/video/build/test-results/
          retention-days: 7
