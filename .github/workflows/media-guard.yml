name: media-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  allowlist:
    name: No media outside the allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check media paths
        run: |
          # Audio and image files may only live in these paths. Copyrighted content never enters the repo.
          allow='^(packs/|brand/|spec/fixtures/|android/[^/]+/src/[^/]+/res/|android/[^/]+/src/[^/]+/assets/|web/static/|web/src/lib/assets/|docs/images/|tools/packer/src/test/resources/)'
          ext='\.(ogg|opus|oga|mp3|m4a|aac|flac|wav|mid|midi|png|jpe?g|webp|gif|avif|jxl|svg|bmp|heic|heif|webm|mp4|mov|soundpack)$'
          bad=$(git ls-files | grep -iE "$ext" | grep -vE "$allow" || true)
          if [ -n "$bad" ]; then
            echo "::error::Media files outside the allowlist (see CLAUDE.md):"
            echo "$bad"
            exit 1
          fi
          echo "Media allowlist OK"
