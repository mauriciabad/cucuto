name: packs-release

# Publishes the demo packs (packs/) as a GitHub Release: every pack and the demo bundle as *.soundpack.zip assets,
# plus repository.zip, the `packer index` output (repository.json + previews) whose download URLs point at those
# assets. The website build (ci.yml, web job) downloads repository.zip from the newest packs-v* release and serves it at
# /repo/index.json, the app's default pack repository.
#
# Release: push a tag `packs-vN` (or run this workflow with that tag). The release is never marked "latest", so
# /releases/latest keeps pointing at the app.

on:
  push:
    tags: ["packs-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (packs-vN). Created on the selected branch if it does not exist."
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: packs-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish demo packs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^packs-v[0-9]+$ ]] || { echo "::error::Tag must look like packs-v1, got '$TAG'"; exit 1; }

      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tests already ran in ci.yml (packs job) on the way to main.
      - name: Build packer
        working-directory: tools/packer
        run: ./gradlew installDist --stacktrace

      - name: Build demo packs
        run: |
          packer=tools/packer/cli/build/install/packer/bin/packer
          mkdir -p dist
          for pack in packs/*/pack.yaml; do
            "$packer" build "$(dirname "$pack")" -o dist/
          done
          "$packer" bundle --id app.mauri.demo.all --name "Cucuto demo packs" --version 1.1.0 \
            --author "Cucuto contributors" --license CC0-1.0 \
            --description "Every Cucuto demo pack in one file." \
            --cover packs/demo-bundle-cover.svg -o dist/ packs/chiptune-critters packs/kitchen-orchestra
          "$packer" validate --strict dist/*.soundpack.zip

      - name: Build repository index
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          packer=tools/packer/cli/build/install/packer/bin/packer
          "$packer" index -o dist/repo \
            --name "Cucuto demo packs" --homepage https://cucuto.mauri.app \
            --description "Free CC0 packs made for Cucuto." \
            --download-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            dist/*.soundpack.zip
          "$packer" validate dist/repo/repository.json
          (cd dist/repo && zip -X -D -r ../repository.zip repository.json previews)
          (cd dist && sha256sum *.soundpack.zip repository.zip | tee SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '> [!NOTE]'
            echo '> 🤖 Written by an AI agent (Claude), not by the repository owner.'
            echo
            echo "Free CC0 demo packs for Cucuto, built from \`packs/\` at ${GITHUB_SHA::7} by the packs-release workflow."
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            for f in dist/*.soundpack.zip; do
              echo "| \`$(basename "$f")\` | $(numfmt --to=si --suffix=B "$(stat -c %s "$f")") |"
            done
            echo
            echo 'Import a `.soundpack.zip` in the app, or add the repository <https://cucuto.mauri.app/repo/index.json>'
            echo '(the default one) to browse them. `repository.zip` is the `packer index` output the website serves;'
            echo '`SHA256SUMS` lists the checksums.'
          } > dist/notes.md
          assets=(dist/*.soundpack.zip dist/repository.zip dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --latest=false \
              --title "Demo packs ${TAG#packs-}" --notes-file dist/notes.md
          fi

      # Releases created with GITHUB_TOKEN don't trigger other workflows, so start the site rebuild explicitly.
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.event.repository.default_branch }}" -f site_only=true
