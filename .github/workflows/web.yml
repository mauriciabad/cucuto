name: web

# Builds, tests and deploys the site. The build reads the latest app release (version, APK size and URL) and the
# newest packs-v* release (repository.zip, served at /repo/index.json) from the GitHub Releases API, so a published
# release triggers a rebuild of main: release events re-dispatch this workflow on main (the github-pages
# environment only deploys from main), and packs-release.yml dispatches it directly.

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  rebuild:
    name: Rebuild main after a release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the site build on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

  verify:
    name: Check, lint, build, test
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    env:
      # Read-only token for the Releases API at build time (higher rate limit than anonymous requests).
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Encoded images (JPEG XL, AVIF, PNG) keyed by the sources and the encoder settings, see scripts/picture.ts.
      - name: Cache encoded images
        id: picture-cache
        uses: actions/cache@v6
        with:
          path: web/node_modules/.cache/picture
          key: picture-${{ hashFiles('web/src/lib/assets/images/**', 'web/scripts/picture.ts') }}

      - name: Install cjxl (JPEG XL encoder)
        if: steps.picture-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libjxl-tools

      - name: Type-check (svelte-check)
        run: pnpm check

      - name: Lint (Prettier + ESLint)
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Fail instead of silently skipping JPEG XL when cjxl is missing.
          PICTURE_REQUIRE_JXL: ${{ steps.picture-cache.outputs.cache-hit != 'true' && '1' || '' }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke and accessibility tests
        run: pnpm test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
