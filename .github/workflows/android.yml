name: android

on:
  pull_request:
    paths:
      - "android/**"
      - "brand/tokens/**"
      - "brand/app-icon/android-res/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "brand/tokens/**"
      - "brand/app-icon/android-res/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and validates the wrapper; the cache is written only from main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` = debug and release APKs (R8), Android Lint, ktlint (Spotless) and every module's unit tests.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cucuto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
