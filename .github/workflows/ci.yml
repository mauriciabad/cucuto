name: ci

# One workflow for every check. It runs on every PR and every push to main; the `changes` job decides which jobs
# actually run (path filtering), and `ci-ok` is the single required status check of the `main` ruleset. It passes
# when every job passed or was skipped and fails when any failed or was cancelled, so agents can open a PR, run
# `gh pr merge --auto --squash` and move on (see CLAUDE.md, Workflow).
#
# Gradle: gradle/actions/setup-gradle caches the Gradle home and build cache (written only from main, read on PRs)
# and, when the GRADLE_ENCRYPTION_KEY secret is available, the configuration cache.

on:
  pull_request:
  push:
    branches: [main]
  # Also started by site-rebuild.yml (release published), release.yml and packs-release.yml with site_only, so the website
  # picks up new release data (APK version and size, /repo/index.json) and redeploys.
  workflow_dispatch:
    inputs:
      site_only:
        description: "Only build, test and deploy the website (skip Android and packer)"
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR cancels its previous run; runs on main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ (github.event_name == 'workflow_dispatch' && !inputs.site_only) || steps.filter.outputs.android == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      packs: ${{ (github.event_name == 'workflow_dispatch' && !inputs.site_only) || steps.filter.outputs.packs == 'true' }}
      metadata: ${{ steps.filter.outputs.metadata == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - "android/**"
              - "shared/**"
              # The screenshot tests draw the demo packs' sprites (ADR 0032).
              - "packs/**"
              - "spec/**"
              - "brand/tokens/**"
              - "brand/app-icon/android-res/**"
              - "brand/sounds/**"
              # The routing integration suite installs the demo packs' clips (ADR 0047).
              - "packs/**"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              # Rendered at /authors/pack-format/.
              - "docs/pack-format.md"
              # The site's pack checker is shared/pack-spec compiled to JavaScript, tested with every fixture in spec/.
              - "shared/**"
              - "spec/**"
              - ".github/workflows/ci.yml"
            packs:
              - "tools/packer/**"
              - "shared/**"
              - "spec/**"
              - "packs/**"
              - ".github/workflows/ci.yml"
            metadata:
              - "fastlane/**"
              - "tools/release/**"
              - ".github/workflows/ci.yml"

  media-guard:
    name: No media outside the allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check media paths
        run: |
          # Audio, image and zip files (packs are <name>.soundpack.zip, backups cucuto-backup-*.zip) may only live in these paths. Copyrighted content never enters the repo.
          # android/app/src/testDebug/screenshots/: golden images of the screenshot tests, rendered from the CC0 demo packs and made-up chats (ADR 0032).
          # fastlane/metadata/android/<locale>/images/: the store listing's icon (from brand/) and screenshots, rendered by the same tests (ADR 0046).
          allow='^(packs/|brand/|spec/fixtures/|android/[^/]+/src/[^/]+/res/|android/[^/]+/src/[^/]+/assets/|android/core/[^/]+/src/[^/]+/(res|assets|resources)/|android/app/src/testDebug/screenshots/[^/]+\.png$|fastlane/metadata/android/[^/]+/images/[^/]+\.png$|fastlane/metadata/android/[^/]+/images/phoneScreenshots/[^/]+\.png$|web/static/|web/src/lib/assets/|docs/images/|tools/packer/src/test/resources/)'
          ext='\.(ogg|opus|oga|mp3|m4a|aac|flac|wav|mid|midi|png|jpe?g|webp|gif|avif|jxl|svg|bmp|heic|heif|webm|mp4|mov|soundpack|zip)$'
          bad=$(git ls-files | grep -iE "$ext" | grep -vE "$allow" || true)
          if [ -n "$bad" ]; then
            echo "::error::Media files outside the allowlist (see CLAUDE.md):"
            echo "$bad"
            exit 1
          fi
          echo "Media allowlist OK"

  # Store listing metadata (fastlane/, ADR 0046): the length limits F-Droid, IzzyOnDroid and Obtainium enforce, so a
  # too-long description or changelog fails here instead of being cut off. The runner's Kotlin CLI runs the script.
  store-metadata:
    name: Store metadata
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check titles, descriptions and changelogs
        run: kotlin tools/release/release-notes.main.kts --check

  # Android: `./gradlew build assembleDebugAndroidTest` split into three parallel jobs (assemble, unit tests, lint).
  # Instrumented tests need a device: they are only compiled here.
  android-assemble:
    name: Android assemble (debug + release APKs)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # :core:jxl builds its Rust crate (jxl-rs behind JNI, ADR 0006) with cargo-ndk; only this job packages it
      # (unit tests and lint never need the library). Kept fast and cached:
      # - the Rust toolchain and the Android target come from android/core/jxl/rust/rust-toolchain.toml (rustup is
      #   preinstalled on the runner), cargo-ndk is a prebuilt binary, NDK r30 comes from sdkmanager;
      # - rust-cache keeps ~/.cargo and the crate's target/, so a crate change recompiles incrementally;
      # - the cargoNdk task is cacheable, so with an unchanged crate the Gradle build cache restores the library and
      #   cargo does not run at all.
      - name: Set up Rust toolchain (rust-toolchain.toml)
        working-directory: android/core/jxl/rust
        run: rustup toolchain install

      - name: Set up cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Install NDK r30
        # `yes` dies of SIGPIPE when sdkmanager exits; under pipefail that would fail the step.
        run: |
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/core/jxl/rust -> target

      # Debug and release APKs (R8, plus lintVital on release), the instrumented test APKs and the Baseline Profile
      # generator (#226, docs/baseline-profile.md), which only runs on a device. Not plain `assemble`: the Baseline
      # Profile plugin adds two more app build types (nonMinifiedRelease, benchmarkRelease) that only the generator
      # needs; its own APK builds against nonMinifiedRelease.
      - name: Assemble
        run: >-
          ./gradlew assembleDebug assembleRelease assembleDebugAndroidTest
          :baselineprofile:assembleNonMinifiedRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cucuto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-assemble-reports
          path: android/**/build/reports/
          retention-days: 7

  android-test:
    name: Android unit tests and ktlint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # `check` minus Android Lint (own job): every module's unit tests (including every golden fixture in spec/
      # through the pack importer), ktlint (Spotless) and the screenshot tests in verify mode: a screen that no longer
      # matches its golden image in android/app/src/testDebug/screenshots/ fails (ADR 0032). The diff images are in
      # the uploaded reports; re-record with `./gradlew :app:recordRoborazziDebug` when the change is intended.
      - name: Unit tests, screenshot tests and ktlint
        run: ./gradlew check -x lint -Proborazzi.test.verify=true --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
            android/**/build/outputs/roborazzi/
          retention-days: 7

  android-lint:
    name: Android Lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: android/**/build/reports/
          retention-days: 7

  # shared/pack-spec compiled to JavaScript for the website (ADR 0022): only the Kotlin compiler runs (no Node.js,
  # npm or webpack). The `web` job downloads the module before it type-checks, builds and tests the site.
  pack-spec-js:
    name: pack-spec for the browser (Kotlin/JS)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shared/pack-spec
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Compile the browser module
        run: ./gradlew syncWebPackSpec --build-cache --configuration-cache --stacktrace

      - name: Upload the browser module
        uses: actions/upload-artifact@v7
        with:
          name: pack-spec-js
          path: web/src/lib/pack-spec/generated/
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web check, lint, build, test
    # Explicit order: the site embeds the pack-spec module built by `pack-spec-js`.
    needs: [changes, pack-spec-js]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # The build reads the latest app release and the newest packs-v* release from the GitHub Releases API
      # (web/scripts/build-data.ts); the token only raises the rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # Bun runs everything: installs, scripts and their CLIs (web/bunfig.toml sets `run.bun`, so Vite, svelte-check,
      # ESLint and Playwright run on Bun even though the runner has Node). The version comes from `packageManager`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      # Bun's global package cache (https://bun.com/docs/pm/global-cache), keyed by the text lockfile.
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the pack-spec browser module
        uses: actions/download-artifact@v8
        with:
          name: pack-spec-js
          path: web/src/lib/pack-spec/generated/

      # Every golden fixture in spec/fixtures through the browser build, with the codes packer and the app report
      # (their own jobs run the same fixtures on the JVM: packer's `check` and Android's :core:pack tests).
      - name: Golden fixtures (browser build of pack-spec, Bun)
        run: bun run test:unit

      # Encoded images (JPEG XL, AVIF, PNG) keyed by their sources and the encoder settings (web/scripts/picture.ts).
      - name: Cache encoded images
        id: picture-cache
        uses: actions/cache@v6
        with:
          path: web/node_modules/.cache/picture
          key: picture-${{ hashFiles('web/src/lib/assets/images/**', 'web/scripts/picture.ts') }}

      - name: Install cjxl (JPEG XL encoder)
        if: steps.picture-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libjxl-tools

      - name: Type-check (svelte-check)
        run: bun run check

      - name: Lint (Prettier + ESLint)
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          # Fail instead of silently skipping JPEG XL when images need encoding.
          PICTURE_REQUIRE_JXL: ${{ steps.picture-cache.outputs.cache-hit != 'true' && '1' || '' }}
          # Fail instead of building the site without its pack checker.
          CUCUTO_REQUIRE_PACK_SPEC: "1"

      - name: Install Playwright browser
        run: bun run playwright install --with-deps chromium

      - name: Playwright smoke and accessibility tests
        run: bun run test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/

  # packer (tools/packer): build and tests, including shared/pack-spec and every golden fixture in spec/fixtures.
  # Demo packs (packs/): build each pack, the demo bundle and a repository index, and upload them as artifacts.
  packs:
    name: packer tests, demo packs and repository index
    needs: changes
    if: needs.changes.outputs.packs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # ffmpeg (with libopus) for the ring file and auto-cut clip tests; building the demo packs never needs it.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Build and test packer
        working-directory: tools/packer
        run: ./gradlew build installDist --build-cache --configuration-cache --stacktrace

      - name: Build demo packs
        run: |
          packer=tools/packer/cli/build/install/packer/bin/packer
          mkdir -p dist
          for pack in packs/*/pack.yaml; do
            "$packer" build "$(dirname "$pack")" -o dist/
          done
          "$packer" bundle --id app.mauri.demo.all --name "Cucuto demo packs" --version 1.1.0 \
            --author "Cucuto contributors" --license CC0-1.0 \
            --description "Every Cucuto demo pack in one file." \
            --cover packs/demo-bundle-cover.svg -o dist/ packs/chiptune-critters packs/kitchen-orchestra
          "$packer" validate --strict dist/*.soundpack.zip

      # The Android routing integration suite installs the demo packs from checked-in manifests (ADR 0047): they
      # must be exactly what the packer builds from pack.yaml.
      - name: Check the integration suite's demo manifests
        run: |
          for pack in packs/*/pack.yaml; do
            id=$(sed -n 's/^id: //p' "$pack")
            version=$(sed -n 's/^version: //p' "$pack")
            manifest="android/xposed/src/test/resources/integration/demo-packs/$id.json"
            if ! unzip -p "dist/$id-$version.soundpack.zip" pack.json | diff -u "$manifest" -; then
              echo "::error file=$manifest::Out of date: build the pack with packer and copy its pack.json here (ADR 0047)"
              exit 1
            fi
          done

      - name: Build repository index
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          tools/packer/cli/build/install/packer/bin/packer index -o dist/repo \
            --name "Cucuto demo packs" --homepage https://cucuto.mauri.app \
            --description "Free CC0 packs made for Cucuto." dist/
          tools/packer/cli/build/install/packer/bin/packer validate dist/repo/repository.json
          (cd dist && sha256sum -- *.soundpack.zip | tee SHA256SUMS)

      - name: Upload demo packs
        uses: actions/upload-artifact@v7
        with:
          name: demo-packs
          path: |
            dist/*.soundpack.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload repository
        uses: actions/upload-artifact@v7
        with:
          name: demo-repository
          path: dist/repo/
          if-no-files-found: error
          retention-days: 30

      - name: Upload packer distribution
        uses: actions/upload-artifact@v7
        with:
          name: packer
          path: tools/packer/cli/build/install/packer/
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packer-reports
          path: |
            tools/packer/**/build/reports/
            tools/packer/**/build/test-results/
          retention-days: 7

  # Push or dispatch on main only (never on PRs): publish the website built by the `web` job.
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: web
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # The single required status check. Do not rename: the `main` ruleset requires a check named exactly `ci-ok`.
  ci-ok:
    name: ci-ok
    needs: [changes, media-guard, store-metadata, android-assemble, android-test, android-lint, pack-spec-js, web, packs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
