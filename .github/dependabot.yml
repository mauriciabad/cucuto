# Dependency updates (docs/decisions/0004-dependabot-for-dependency-updates.md).
version: 2

updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    labels: ["area:android", "type:chore"]
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      androidx-and-agp:
        patterns:
          - "androidx.*"
          - "com.android.tools.build*"
      android-libraries:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /tools/packer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: ["area:packer", "type:chore"]
    groups:
      packer:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /shared/pack-spec
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: ["area:pack", "type:chore"]
    groups:
      pack-spec:
        patterns:
          - "*"

  # The Rust crate of :core:jxl (jxl-rs behind JNI, ADR 0006). jxl-rs is 0.x and pinned exactly, so each bump is a
  # PR of its own. CI rebuilds the library; the decoder tests need a device (android/core/jxl/README.md).
  - package-ecosystem: cargo
    directory: /android/core/jxl/rust
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: ["area:android", "type:chore"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels: ["area:ci", "type:chore"]
    groups:
      github-actions:
        patterns:
          - "*"

  # JavaScript tooling runs on Bun (#115): Dependabot's `bun` ecosystem reads package.json and the text bun.lock.
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: ["area:web", "type:chore"]
    groups:
      web:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /brand/tools
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    labels: ["area:brand", "type:chore"]
    groups:
      brand-tools:
        patterns:
          - "*"
